name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage A - Install npm 10.9.4 for scanner compatibility
        run: npm install -g npm@10.9.4
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx --yes @n8n/scan-community-package@0.39.0 .
      - name: Stage B - Upgrade to npm 11.5.1 for provenance publishing
        run: |
          npm install -g npm@11.5.1
          npm --version
      - name: Verify OIDC environment and npmrc
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo PRESENT || echo MISSING)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo PRESENT || echo MISSING)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "Missing OIDC environment variables"
            exit 1
          fi
          for cfg in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc"; do
            if [ -n "$cfg" ] && [ -f "$cfg" ] && grep -qE '_authToken=\s*$' "$cfg"; then
              echo "Empty _authToken found in $cfg"
              exit 1
            fi
          done
      - run: npm publish --provenance --access public --registry=https://registry.npmjs.org
