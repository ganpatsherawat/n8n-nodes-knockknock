name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Stage A - Install npm 10.9.4 for scanner compatibility
        run: npm install -g npm@10.9.4
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx --yes @n8n/scan-community-package@0.39.0 .
      - name: Stage B - Upgrade to npm 11.6.2 for provenance publishing
        run: |
          npm install -g npm@11.6.2
          NPM_VER=$(npm --version)
          echo "npm version: $NPM_VER"
          if [ "$NPM_VER" != "11.6.2" ]; then
            echo "Expected npm 11.6.2, got $NPM_VER"
            exit 1
          fi
      - name: Verify OIDC environment
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo PRESENT || echo MISSING)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo PRESENT || echo MISSING)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "Missing OIDC environment variables"
            exit 1
          fi
      - run: npm publish --provenance --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
